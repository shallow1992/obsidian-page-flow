name: Build & Test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v7
      with:
        node-version: 22.x

    - name: Install dependencies
      run: npm ci

    - name: Run automated unit tests (Vitest)
      run: npm test

    - name: Type check and Build
      run: npm run build
