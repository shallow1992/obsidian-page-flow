services:
  page-flow: &page-flow
    build: .
    container_name: obsidian-page-flow-dev
    working_dir: /app
    volumes:
      - ./:/app
      - page_flow_node_modules:/app/node_modules
    command: npm run dev
    networks:
      - devnet

volumes:
  page_flow_node_modules:

networks:
  devnet:
    external: true
